<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Emblem Container -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Stylized Ram Head / Horns (Koç Başı ve Boynuzları) -->
    <!-- Left Horn -->
    <path d="M -30,-40 C -70,-100 -160,-80 -160,-10 C -160,50 -90,70 -60,40 C -40,20 -40,0 -50,-10 C -70,-30 -110,-20 -110,-10 C -110,25 -70,10 -50,-15 Z" fill="url(#goldGrad)" />
    <!-- Right Horn -->
    <path d="M 30,-40 C 70,-100 160,-80 160,-10 C 160,50 90,70 60,40 C 40,20 40,0 50,-10 C 70,-30 110,-20 110,-10 C 110,25 70,10 50,-15 Z" fill="url(#goldGrad)" />
    
    <!-- Face / Muzzle -->
    <path d="M 0,-55 C 35,-55 45,-20 40,30 C 35,70 20,95 0,105 C -20,95 -35,70 -40,30 C -45,-20 -35,-55 0,-55 Z" fill="#ffffff" />
    
    <!-- Forehead Wool Crest -->
    <circle cx="0" cy="-45" r="24" fill="#fef08a" />
    <circle cx="-18" cy="-40" r="16" fill="#fde047" />
    <circle cx="18" cy="-40" r="16" fill="#fde047" />

    <!-- Eyes -->
    <ellipse cx="-18" cy="5" rx="5" ry="7" fill="#78350f" />
    <ellipse cx="18" cy="5" rx="5" ry="7" fill="#78350f" />

    <!-- Nose / Mouth -->
    <path d="M -12,65 Q 0,78 12,65" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="60" x2="0" y2="72" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

    <!-- Virtual Ear Tag (Sarı Küpe) -->
    <g transform="translate(42, 10)">
      <polygon points="0,0 20,2 18,24 -2,22" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" />
      <circle cx="8" cy="6" r="2.5" fill="#78350f" />
      <text x="8" y="18" font-family="monospace" font-size="7" font-weight="900" fill="#451a03" text-anchor="middle">TR42</text>
    </g>
  </g>

  <!-- Typography: ALTUN ÇİFTLİK -->
  <text x="256" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff" text-anchor="middle">
    ALTUN ÇİFTLİK
  </text>
  <text x="256" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#fbbf24" text-anchor="middle">
    SÜRÜ YÖNETİMİ
  </text>
</svg>
